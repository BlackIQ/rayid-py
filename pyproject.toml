[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rayid"
version = "1.1.1"
description = "RayID is a generated code that we use to track logs, posts or events."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Amirhossein Mohammadi", email = "amirhosseinmohammadi1380@yahoo.com" }
]
keywords = [
    "rayid",
    "id",
    "generator",
    "random",
    "tracking"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://gitlab.com/blackiq-packages/pypi/rayid"
Repository = "https://gitlab.com/blackiq-packages/pypi/rayid"
Issues = "https://gitlab.com/blackiq-packages/pypi/rayid/-/issues"

[tool.setuptools.packages.find]
include = ["rayid*"]

[dependency-groups]
dev = [
    "build>=1.2.2.post1",
    "pytest>=8.3.5",
    "twine>=6.1.0",
]
