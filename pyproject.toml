[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rayid"
version = "1.1.4"
description = "RayID is a generated code that we use to track logs, posts or events."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Amirhossein Mohammadi", email = "amirhosseinmohammadi1380@yahoo.com" }
]
keywords = [
    "rayid",
    "id",
    "generator",
    "random",
    "tracking"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://rayid-py.amirhossein.info"
Repository = "https://github.com/BlackIQ/rayid-py"
Issues = "https://github.com/BlackIQ/rayid-py/issues"

[tool.setuptools.packages.find]
include = ["rayid*"]

[dependency-groups]
dev = [
    "build>=1.4.4",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "pytest>=8.4.2",
    "twine>=6.2.0",
]

